<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to GitHub · CSA.Skills</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f6f8fa;
      color: #1f2328;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo {
      margin-bottom: 1.5rem;
    }
    .logo svg { fill: #1f2328; }

    .card {
      background: #ffffff;
      border: 1px solid #d8dee4;
      border-radius: 6px;
      padding: 1.25rem;
      width: 308px;
      text-align: center;
    }

    .card h1 {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: -0.5px;
      margin-bottom: 0.75rem;
      color: #1f2328;
    }

    .card .repo-name {
      font-size: 0.875rem;
      color: #656d76;
      margin-bottom: 0.25rem;
    }

    .card .ms-only {
      font-size: 0.8125rem;
      color: #656d76;
      margin-bottom: 0.75rem;
      font-style: italic;
    }

    .card .use-personal {
      font-size: 0.8125rem;
      color: #656d76;
      margin-bottom: 1rem;
    }

    .btn-signin {
      display: block;
      width: 100%;
      padding: 0.3125rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.4285;
      color: #fff;
      background-color: #2da44e;
      border: 1px solid rgba(27, 31, 36, 0.15);
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.2s;
    }
    .btn-signin:hover {
      background-color: #2c974b;
    }

    .footer-note {
      margin-top: 1rem;
      width: 308px;
      text-align: center;
      font-size: 0.75rem;
      color: #656d76;
      border: 1px solid #d8dee4;
      border-radius: 6px;
      padding: 1rem;
      background: #ffffff;
    }
    .footer-note a {
      color: #0969da;
      text-decoration: none;
    }
    .footer-note a:hover {
      text-decoration: underline;
    }

    /* Result messages (shown via query params) */
    .msg {
      width: 308px;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
      text-align: center;
    }
    .msg.success { display: block; background: #dafbe1; border: 1px solid #2da44e; color: #1a7f37; }
    .msg.error { display: block; background: #ffebe9; border: 1px solid #cf222e; color: #cf222e; }
  </style>
</head>
<body>

  <!-- GitHub Logo -->
  <div class="logo">
    <svg height="48" viewBox="0 0 16 16" width="48" aria-hidden="true">
      <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
    </svg>
  </div>

  <div id="msg"></div>

  <div class="card">
    <h1>Sign in to GitHub</h1>
    <p class="repo-name">CSA.Skills Repository Access</p>
    <p class="ms-only">Microsoft Employees Only</p>
    <p class="use-personal">Use personal GitHub account</p>

    <a class="btn-signin" href="https://repo-access.promney.workers.dev/auth">
      Sign in
    </a>
  </div>

  <div class="footer-note">
    Having trouble? Contact <a href="mailto:preston.romney@microsoft.com">preston.romney@microsoft.com</a> for a manual invite.
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const msgEl = document.getElementById('msg');
    if (params.get('success')) {
      msgEl.className = 'msg success';
      msgEl.textContent = decodeURIComponent(params.get('success'));
    } else if (params.get('error')) {
      msgEl.className = 'msg error';
      msgEl.textContent = decodeURIComponent(params.get('error'));
    }
  </script>
</body>
</html>
